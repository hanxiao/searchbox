<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Searchbox: budget-bounded closed-dataroom QA</title>
<meta name="description" content="Give a prompt, a zip, and a turn budget. A self-hosted model (Qwen3.6) in a Pi harness explores the dataroom offline with local Jina embedding + reranker retrieval for that many turns, then answers fully cited." />
<meta name="keywords" content="searchbox, closed-dataroom QA, retrieval, RAG, Pi agent, Qwen3.6, jina embeddings, jina reranker, test-time compute, budget forcing" />
<link rel="canonical" href="https://hanxiao.io/searchbox/" />
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<meta name="theme-color" content="#000000" />

<!-- Open Graph -->
<meta property="og:type" content="website" />
<meta property="og:site_name" content="Searchbox" />
<meta property="og:title" content="Searchbox: budget-bounded closed-dataroom QA" />
<meta property="og:description" content="A self-hosted model (Qwen3.6) in a Pi harness explores an uploaded dataroom offline with local Jina embedding + reranker retrieval, looping under a turn budget (budget forcing) to trade test-time compute for answer quality." />
<meta property="og:url" content="https://hanxiao.io/searchbox/" />
<meta property="og:image" content="https://hanxiao.io/searchbox/og-image.jpg" />
<meta property="og:image:width" content="2046" />

<meta property="og:image:alt" content="Searchbox flow: a dataroom.zip enters a sealed no-network room where qwen3.6 loops with a dense retriever (pi loop) under budget forcing, producing one answer." />

<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Searchbox: budget-bounded closed-dataroom QA" />
<meta name="twitter:description" content="A self-hosted model (Qwen3.6) in a Pi harness explores an uploaded dataroom offline with local Jina embedding + reranker retrieval, looping under a turn budget to trade test-time compute for answer quality." />
<meta name="twitter:image" content="https://hanxiao.io/searchbox/og-image.jpg" />
<meta name="twitter:image:alt" content="Searchbox flow diagram" />
<style>
  :root{--bg:#fff;--fg:#000;--mut:#666;--line:#000;--soft:#e5e5e5;--fill:#f5f5f5}
  @media (prefers-color-scheme: dark){:root{--bg:#000;--fg:#fff;--mut:#999;--line:#fff;--soft:#222;--fill:#111}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);overflow-x:hidden;
    font-family:"Berkeley Mono",ui-monospace,Menlo,Consolas,monospace;font-size:13px;line-height:1.5}
  .wrap{max-width:820px;margin:0 auto;padding:48px 24px}
  .masthead{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:12px}
  h1{font-size:15px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin:0}
  p{color:var(--mut)}
  .lede{color:var(--fg);margin-top:20px}
  textarea{width:100%;min-height:80px;margin-top:8px;background:var(--bg);color:var(--fg);border:1px solid var(--line);padding:10px;font:inherit;resize:vertical}
  .btn{border:1px solid var(--line);background:var(--fg);color:var(--bg);padding:8px 16px;cursor:pointer;font:inherit}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .field{margin-top:18px}
  .lbl{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin-bottom:6px}
  .fieldrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:18px}
  .fieldrow .btn{margin-left:auto}
  input[type=number]{width:120px;background:var(--bg);color:var(--fg);border:1px solid var(--line);padding:7px 8px;font:inherit}
  /* Custom file picker: native input hidden, label styled like a secondary button to match
     the rest of the monospace/boxed UI. */
  input[type=file]{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0)}
  .filebtn{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .filebtn .pick{border:1px solid var(--line);background:var(--bg);color:var(--fg);padding:7px 14px;cursor:pointer;font:inherit;white-space:nowrap}
  .filebtn .pick:hover{background:var(--soft)}
  .filebtn .fname{color:var(--mut);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px}
  .jobs{margin-top:36px;border-top:1px solid var(--line);padding-top:16px}
  .job{display:flex;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--soft);cursor:pointer}
  .job:hover{background:var(--fill)}
  .job .st{flex:none;width:14px}
  .job .q{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .job .pg{color:var(--mut);flex:none;width:140px;font-size:12px;text-align:right}
  .job .pg .lab{display:block;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .job .pbar{height:6px;border:1px solid var(--line);position:relative;overflow:hidden}
  .job .pbar > i{position:absolute;left:0;top:0;bottom:0;background:var(--mut);width:0%}
  .job .pbar.over > i{background:repeating-linear-gradient(45deg,var(--mut) 0 4px,transparent 4px 8px)}
  .job .acts{flex:none;display:flex;gap:5px}
  .dot{display:inline-block;width:7px;height:7px;border:1px solid var(--line)}
  .dot.on{background:var(--fg)}
  .blink{animation:b 1s steps(2) infinite}@keyframes b{50%{opacity:.2}}
  .icon{width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:var(--bg);color:var(--fg);text-decoration:none}
  .icon:hover{background:var(--soft)}
  .icon[aria-disabled=true]{opacity:.3;pointer-events:none}
  .msg{margin-top:12px;color:var(--mut);font-size:12px}
  .toggle{display:inline-flex;align-items:center;gap:7px;cursor:pointer;user-select:none;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
  .toggle input{width:14px;height:14px;accent-color:var(--fg);cursor:pointer}
  .tools{display:flex;flex-wrap:wrap;gap:16px}
  .tools .toggle{text-transform:none;letter-spacing:0;font-size:12px;color:var(--fg)}
  .tools{flex-direction:column;gap:10px}
  .toolgroup{border:1px solid var(--line);padding:8px 10px}
  .grouphead{text-transform:none;letter-spacing:0;font-size:12px;font-weight:600;color:var(--fg)}
  .grouptools{display:flex;flex-wrap:wrap;gap:14px;margin-top:8px;padding-left:22px}
  #budgetwrap.off{opacity:.35;pointer-events:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="masthead"><h1>Searchbox</h1><a class="icon" href="https://github.com/hanxiao/searchbox" target="_blank" rel="noopener" title="Source on GitHub"><svg viewBox="0 0 16 16" width="15" height="15" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0016 8c0-4.42-3.58-8-8-8z"/></svg></a></div>

  <form id="f">
    <div class="field">
      <label class="lbl" for="prompt">Prompt</label>
      <textarea id="prompt" placeholder="What question should be answered from the dataroom?"></textarea>
    </div>
    <div class="field">
      <label class="lbl" for="dataroom">Dataroom (.zip, optional &mdash; jina-corpus.zip by default)</label>
      <div class="filebtn">
        <label class="pick" for="dataroom">Upload .zip</label>
        <input type="file" id="dataroom" accept=".zip,application/zip,application/x-zip-compressed" />
        <span class="fname" id="fname"></span>
        <label class="toggle" style="margin-left:18px">
          <input type="checkbox" id="force" />
          <span>Force budget</span>
        </label>
        <div id="budgetwrap" class="off">
          <input type="number" id="budget" value="10" min="1" step="1" title="budget in turns (agent cycles)" />
          <span style="color:var(--mut);font-size:12px">turns</span>
        </div>
      </div>
    </div>
    <div class="field">
      <label class="lbl">Add-ons <span id="toolcount" style="text-transform:none;letter-spacing:0;color:var(--mut)">besides built-in bash, grep, read</span></label>
      <div class="tools" id="tools"></div>
    </div>
    <div class="fieldrow">
      <button class="btn" type="submit" id="go">Run</button>
    </div>
  </form>
  <div class="msg" id="msg"></div>

  <div class="jobs">
    <div class="lbl">Recent jobs</div>
    <div id="jobs"><div class="msg">none yet</div></div>
  </div>
</div>
<script>
// Subpath-aware base prefix: empty when served at /, '/searchbox' when mounted under
// hanxiao.io/searchbox via the CF worker. Derived from the path this page was served at.
const BASE=(location.pathname.replace(/\/+$/,'')||'');
const $=id=>document.getElementById(id);
const escn=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
// Load the external-tool catalog and render the toggle list.
(async()=>{
  try{
    /*OPENCLAW_TOOL_GROUPS*/
    const r=await fetch(BASE+"/tools",{cache:"no-store"});const d=await r.json();
    const tools=d.tools||[];
    // Group tools by tier (high/low). Each group gets a master toggle that checks/unchecks
    // every tool in it. A tool is checked by default iff its catalog default flag is set.
    const GROUP_META={high:{label:"High-level (task tools)",desc:"You say what you want; the tool runs the whole pipeline over the dataroom."},low:{label:"Low-level (model primitives)",desc:"Stateless single-model ops on data you pass in."}};
    const order=["high","low"];
    const groups={};
    for(const t of tools){(groups[t.group||"low"]=groups[t.group||"low"]||[]).push(t);}
    const keys=order.filter(k=>groups[k]).concat(Object.keys(groups).filter(k=>!order.includes(k)));
    $("tools").innerHTML=keys.map(g=>{
      const meta=GROUP_META[g]||{label:g,desc:""};
      const rows=groups[g].map(t=>
        `<label class="toggle" title="${escn(t.desc)}"><input type="checkbox" class="tool" data-group="${escn(g)}" value="${escn(t.name)}" ${t.default?"checked":""} /><span>${escn(t.name)}</span></label>`
      ).join("");
      return `<div class="toolgroup"><label class="toggle grouphead" title="${escn(meta.desc)}"><input type="checkbox" class="groupmaster" data-group="${escn(g)}" /><span>${escn(meta.label)}</span></label><div class="grouptools">${rows}</div></div>`;
    }).join("");
    // Wire master toggles + keep them in sync with member state.
    function syncMaster(g){
      const members=[...document.querySelectorAll(`.tool[data-group="${g}"]`)];
      const m=document.querySelector(`.groupmaster[data-group="${g}"]`);
      if(!m)return;
      const on=members.filter(c=>c.checked).length;
      m.checked=on===members.length&&members.length>0;
      m.indeterminate=on>0&&on<members.length;
    }
    document.querySelectorAll(".groupmaster").forEach(m=>{
      m.addEventListener("change",()=>{
        const g=m.dataset.group;
        document.querySelectorAll(`.tool[data-group="${g}"]`).forEach(c=>{c.checked=m.checked;});
        m.indeterminate=false;
      });
    });
    document.querySelectorAll(".tool").forEach(c=>c.addEventListener("change",()=>syncMaster(c.dataset.group)));
    keys.forEach(syncMaster);
  }catch(e){$("tools").innerHTML='<span class="msg">could not load tools</span>';}
})();
function isZip(f){return f && /\.zip$/i.test(f.name);}
$("dataroom").addEventListener("change",()=>{
  const f=$("dataroom").files[0];
  if(f && !isZip(f)){$("dataroom").value="";$("fname").textContent="";$("msg").textContent="only .zip files are allowed";return;}
  $("msg").textContent="";
  $("fname").textContent=f?f.name:"";
});
$("force").addEventListener("change",()=>{
  $("budgetwrap").classList.toggle("off",!$("force").checked);
});
$("f").addEventListener("submit",async e=>{
  e.preventDefault();
  const prompt=$("prompt").value.trim(), file=$("dataroom").files[0];
  const force=$("force").checked, budget=parseInt($("budget").value,10)||10;
  const tools=[...document.querySelectorAll(".tool:checked")].map(c=>c.value).join(",");
  if(prompt.length<5){$("msg").textContent="prompt too short";return;}
  if(file && !isZip(file)){$("msg").textContent="only .zip files are allowed";return;}
  $("go").disabled=true;$("msg").textContent="queuing…";
  const fd=new FormData();fd.append("prompt",prompt);fd.append("budget",budget);fd.append("force_budget",force?"true":"false");fd.append("tools",tools);
  if(file)fd.append("dataroom",file);
  try{
    const r=await fetch(BASE+"/jobs",{method:"POST",body:fd});
    const d=await r.json();
    if(!r.ok)throw new Error(d.detail||"error");
    location.href=BASE+`/jobs/${d.job_id}/dashboard`;
  }catch(err){$("msg").textContent="failed: "+(err.message||err);$("go").disabled=false;}
});
const esc=s=>String(s==null?"":s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const A='viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"';
const ICON={
  md:`<svg ${A}><path d="M8 2.5v7"/><path d="M5 6.8l3 3 3-3"/><path d="M3.5 12.5h9"/></svg>`,
  trace:`<svg ${A}><path d="M3 3.5h10"/><path d="M3 8h10"/><path d="M3 12.5h6"/></svg>`,
  pause:`<svg ${A}><path d="M5.5 3.5v9"/><path d="M10.5 3.5v9"/></svg>`,
  resume:`<svg ${A}><path d="M5 3.5l8 4.5-8 4.5z"/></svg>`,
};
function dot(s){if(s==="running")return '<span class="dot on blink"></span>';if(s==="done"||s==="stopped"||s==="failed")return '<span class="dot on"></span>';return '<span class="dot"></span>';}
function statusLabel(j){
  if(j.status==="running"&&j.auto)return "running · backfill";
  if(j.status==="paused")return j.preempted?"preempted":"paused";
  if(j.status==="held")return "held";
  return j.status;
}
async function jobAction(id,act){try{await fetch(BASE+`/jobs/${id}/${act}`,{method:"POST"});loadJobs();}catch(e){}}
function acts(j){
  const done=(j.status==="done"||j.status==="stopped");
  const dis=done?"":'aria-disabled="true"';
  const running=(j.status==="running"||j.status==="queued"||j.status==="pausing");
  const paused=(j.status==="paused"||j.status==="held");
  let ctl="";
  if(running)ctl=`<span class="icon" title="pause (sticky: held until you resume)" onclick="event.stopPropagation();jobAction('${j.job_id}','pause')">${ICON.pause}</span>`;
  else if(paused)ctl=`<span class="icon" title="resume" onclick="event.stopPropagation();jobAction('${j.job_id}','resume')">${ICON.resume}</span>`;
  return ctl+
         `<a class="icon" ${dis} title="download ANSWER.md" href="${BASE}/jobs/${j.job_id}/answer/download" onclick="event.stopPropagation()">${ICON.md}</a>`+
         `<a class="icon" ${dis} title="download full LLM trace (HTML, incl. thinking)" href="${BASE}/jobs/${j.job_id}/trace.html" onclick="event.stopPropagation()">${ICON.trace}</a>`;
}
async function loadJobs(){
  try{
    const r=await fetch(BASE+"/jobs",{cache:"no-store"});const d=await r.json();
    const rows=(d.jobs||[]);
    $("jobs").innerHTML=rows.length?rows.map(j=>{
      const term=(j.status==="done"||j.status==="stopped");
      const pct=term?100:Math.max(0,Math.min(100,j.percent||0));
      const over=(j.budget&&(j.spent||0)>j.budget)?" over":"";
      const lab=`${esc(statusLabel(j))}${j.budget?` · ${j.spent||0}/${j.budget}`:""}`;
      const prog=`<span class="lab">${lab}</span>`;
      return `<div class="job" onclick="location.href=BASE+'/jobs/${j.job_id}/dashboard'">`+
        `<span class="st">${dot(j.status)}</span>`+
        `<span class="q" title="${esc(j.query)}">${esc(j.query)||"(no prompt)"}</span>`+
        `<span class="pg">${prog}</span>`+
        `<span class="acts">${acts(j)}</span></div>`;
    }).join(""):'<div class="msg">none yet</div>';
  }catch(e){}
}
loadJobs();setInterval(loadJobs,4000);

// Shared-backend contention hint: the L4 llama-server has 3 slots shared across
// dataroom / KG / searchbox / llamaui. Poll the public slots endpoint (CORS-open)
// and surface a banner when other work is in flight, so a queued run is expected.
(function(){
  var SLOTS_URL="https://hanxiao.io/llama-api/slots";
  var el=document.createElement("div");
  el.id="slotbar";
  el.style.cssText="display:none;margin-top:14px;border:1px solid var(--line);padding:8px 12px;font-size:12px;background:var(--fill);color:var(--fg)";
  var mh=document.querySelector(".masthead");
  if(mh&&mh.parentNode) mh.parentNode.insertBefore(el, mh.nextSibling);
  async function poll(){
    try{
      var r=await fetch(SLOTS_URL,{cache:"no-store"});
      var s=await r.json();
      var busy=s.filter(function(x){return x.is_processing;}).length;
      var total=s.length;
      if(busy>=1){
        el.style.display="block";
        var warn=busy>=total;
        el.innerHTML="● shared L4 backend: <b>"+busy+"/"+total+"</b> slots busy"+(warn?" — all slots in use, new runs will queue":" — a concurrent run may slow generation");
        el.style.borderColor=warn?"#b00":"var(--line)";
      }else{ el.style.display="none"; }
    }catch(e){ el.style.display="none"; }
  }
  poll();setInterval(poll,4000);
})();
</script>
</body>
</html>
